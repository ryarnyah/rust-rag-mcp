<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0366d6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0366d6;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="16" fill="#0d1117"/>
  
  <g filter="url(#glow)">
    <circle cx="30" cy="50" r="7" fill="url(#grad1)" opacity="0.9"/>
    <circle cx="50" cy="32" r="5" fill="#58a6ff" opacity="0.8"/>
    <circle cx="50" cy="68" r="5" fill="#58a6ff" opacity="0.8"/>
    <circle cx="70" cy="50" r="6" fill="url(#grad1)" opacity="0.85"/>
    <circle cx="50" cy="50" r="4" fill="#58a6ff" opacity="0.7"/>
    
    <line x1="30" y1="50" x2="50" y2="32" stroke="url(#grad2)" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="50" x2="50" y2="68" stroke="url(#grad2)" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="32" x2="70" y2="50" stroke="url(#grad2)" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="68" x2="70" y2="50" stroke="url(#grad2)" stroke-width="1.5" opacity="0.6"/>
    <line x1="30" y1="50" x2="50" y2="50" stroke="url(#grad2)" stroke-width="1" opacity="0.4"/>
    <line x1="50" y1="50" x2="70" y2="50" stroke="url(#grad2)" stroke-width="1" opacity="0.4"/>
    <line x1="50" y1="32" x2="50" y2="50" stroke="url(#grad2)" stroke-width="1" opacity="0.4"/>
    <line x1="50" y1="50" x2="50" y2="68" stroke="url(#grad2)" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
