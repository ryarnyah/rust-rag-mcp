[package]
name = "rust-rag-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "RAG MCP server using rig, fastembed, LanceDB, unpdf, undoc"

[[bin]]
name = "rust-rag-mcp"
path = "src/main.rs"

[dependencies]
fastembed = "7.0.1"
rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
unpdf = "0.19"
undoc = "0.11.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
chardetng = "1.0"
encoding_rs = "0.8"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"

thiserror = "2.0.20"
smallvec = "1.11"
crc32fast = "1.3"
memmap2 = "0.9"
arrow-array = "60"
arrow-schema = "60"
ndarray = "0.15"
ordered-float = "4.0"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

#[profile.release]
#opt-level = 3
#lto = true
#codegen-units = 1
#strip = true
#panic = "abort"
#overflow-checks = false
